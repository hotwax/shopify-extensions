api_version = "2024-10"

[[extensions]]
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
handle = "pickup-and-delivery-options"
type = "ui_extension"


# Only 1 target can be specified for each Admin block extension
[[extensions.targeting]]
module = "./src/BlockExtension.jsx"
# The target used here must match the target used in the module file (./src/BlockExtension.jsx)
target = "admin.draft-order-details.block.render"

[[extensions]]
name = "Store Pickup Separate"
handle = "store-pickup-separate-admin-action"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/AdminActionExtension.jsx"
target = "admin.draft-order-details.action.render"